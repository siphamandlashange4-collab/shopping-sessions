name: Shopping Sessions independent scorer-candidate comparison
on:
  create:
  push:
    branches: [buildathon-docker-bench]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shopping-sessions-claude-crosscheck
  cancel-in-progress: true
jobs:
  benchmark:
    if: github.ref == 'refs/heads/buildathon-docker-bench'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Build both unmodified Linux images
        shell: bash
        run: |
          mkdir ci
          cd ci
          git clone --no-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" src
          git -C src worktree add --detach "$PWD/baseline" 7304c6941443e9cd98616f4d5e9f8e34ac99e7fa
          git -C src worktree add --detach "$PWD/candidate" 80a28efa716072ae22d8eecc16448a7988f63c44
          docker build --platform linux/amd64 -t shopping-sessions:baseline baseline
          docker build --platform linux/amd64 -t shopping-sessions:candidate candidate
          docker image inspect --format '{{.Os}}/{{.Architecture}} {{.Config.User}}' shopping-sessions:baseline shopping-sessions:candidate
          nproc
          lscpu | sed -n '/Model name/p'
          if grep -qm1 avx512bw /proc/cpuinfo; then echo 'AVX-512BW available'; else echo 'AVX-512BW unavailable'; fi
          free -h
          df -h .
      - name: Generate official dev and synthetic practice-scale inputs
        shell: bash
        run: |
          cd ci
          files=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          for file in generator.zip dev-answer.zip starter-polars.zip; do
            curl --fail --silent --show-error --location --retry 2 "$files/$file" -o "$file"
          done
          sha256sum -c <<'EOF'
          78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip
          c2439e0e2e7456d721852814e9928e077648803d5c57a1760a40c7d3b0864d20  dev-answer.zip
          EOF
          for zip in *.zip; do unzip -q "$zip"; done
          cargo build --locked --release --manifest-path generator/Cargo.toml
          generator/target/release/generate --seed 1 --events 1000000 --clicks 250000 --output dev
          generator/target/release/generate --seed 41 --events 20000000 --clicks 5000000 --output practice
          python3 -m venv .venv
          .venv/bin/pip install -q -r starter-polars/requirements.txt

      - name: Compare exact output and time both scales
        shell: bash
        run: |
          cd ci
          export CPUS=4 MEM=12g PLATFORM=linux/amd64
          comparer=(.venv/bin/python starter-polars/scripts/compare.py)
          runner=starter-polars/scripts/docker_run.sh
          IMAGE=shopping-sessions:candidate .venv/bin/python starter-polars/scripts/run_fixtures.py starter-polars/fixtures -- sh "$runner"
          for version in baseline candidate; do
            IMAGE="shopping-sessions:$version" sh "$runner" dev "out-dev-$version"
            "${comparer[@]}" "out-dev-$version" dev-answer
          done
          mkdir -m 777 timed-out timed-scratch
          benchmark() {
            local input="$1" cycles="$2"
            for version in baseline candidate; do
              IMAGE="shopping-sessions:$version" sh "$runner" "$input" "out-$input-$version"
            done
            "${comparer[@]}" "out-$input-baseline" "out-$input-candidate"
            for ((cycle=1; cycle<=cycles; cycle++)); do
              if (( cycle % 2 )); then
                order=(baseline candidate)
              else
                order=(candidate baseline)
              fi
              for version in "${order[@]}"; do
                /usr/bin/time -f "$input $version %e" -a -o timings.txt docker run --rm --platform linux/amd64 \
                  --network none --read-only --tmpfs /tmp:rw,size=64m,mode=1777 \
                  --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 \
                  --cpus "$CPUS" --memory "$MEM" --memory-swap "$MEM" --user 1000:1000 \
                  -v "$PWD/$input":/data:ro -v "$PWD/timed-out":/output -v "$PWD/timed-scratch":/scratch \
                  -e DATA_DIR=/data -e OUTPUT_DIR=/output -e SCRATCH_DIR=/scratch -e HOME=/scratch \
                  -e NCPU="$CPUS" -e MEM_GB=12 "shopping-sessions:$version"
              done
            done
          }
          benchmark practice 6
          generator/target/release/generate --seed 77 --events 60000000 --clicks 15000000 --output final-data
          benchmark final-data 4
          cat timings.txt
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from collections import defaultdict
          from statistics import median
          times = defaultdict(list)
          for line in open("timings.txt"):
              dataset, name, seconds = line.split()
              times[dataset, name].append(float(seconds))
          for dataset in ("practice", "final-data"):
              baseline = median(times[dataset, "baseline"])
              candidate = median(times[dataset, "candidate"])
              print(f"{dataset}: baseline {baseline:.3f}s, candidate {candidate:.3f}s, reduction {1-candidate/baseline:.1%}")
          PY
      - name: Check peak cgroup memory at 60M with eight workers
        shell: bash
        run: |
          cd ci
          mkdir -m 777 memory-out memory-scratch
          for version in baseline candidate; do
            echo "Memory check $version"
            docker run --rm --platform linux/amd64 --network none --read-only \
              --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 4096 \
              --cpus 4 --memory 12g --memory-swap 12g --user 1000:1000 \
              -v "$PWD/final-data":/data:ro -v "$PWD/memory-out":/output -v "$PWD/memory-scratch":/scratch \
              -e DATA_DIR=/data -e OUTPUT_DIR=/output -e SCRATCH_DIR=/scratch -e HOME=/scratch \
              -e NCPU=8 -e MEM_GB=12 --entrypoint /bin/sh "shopping-sessions:$version" \
              -c '/app/run.sh && { printf "Peak cgroup bytes: "; cat /sys/fs/cgroup/memory.peak; }'
            .venv/bin/python starter-polars/scripts/compare.py "out-final-data-$version" memory-out
          done
