name: Shopping Sessions allocation settings collaboration benchmark
on:
  push:
    branches: [buildathon-docker-bench]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shopping-sessions-allocator-collaboration
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Build one pinned Linux image for both configurations
        shell: bash
        run: |
          mkdir ci
          cd ci
          git clone --no-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" src
          git -C src worktree add --detach "$PWD/candidate" 80a28efa716072ae22d8eecc16448a7988f63c44
          sed -i 's/^FROM rust:1-slim-bookworm AS build$/FROM rust:1.100.0-slim-bookworm AS build/' candidate/Dockerfile
          grep -F 'FROM rust:1.100.0-slim-bookworm AS build' candidate/Dockerfile
          docker build --platform linux/amd64 -t shopping-sessions:glibc candidate
          nproc
          lscpu | sed -n '/Model name/p'
      - name: Generate official dev and synthetic practice-scale inputs
        shell: bash
        run: |
          cd ci
          files=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          for file in generator.zip dev-answer.zip starter-polars.zip; do
            curl --fail --silent --show-error --location --retry 2 "$files/$file" -o "$file"
          done
          sha256sum -c <<'EOF'
          78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip
          c2439e0e2e7456d721852814e9928e077648803d5c57a1760a40c7d3b0864d20  dev-answer.zip
          EOF
          for zip in *.zip; do unzip -q "$zip"; done
          cargo build --locked --release --manifest-path generator/Cargo.toml
          generator/target/release/generate --seed 1 --events 1000000 --clicks 250000 --output dev
          generator/target/release/generate --seed 41 --events 20000000 --clicks 5000000 --output practice
          python3 -m venv .venv
          .venv/bin/pip install -q -r starter-polars/requirements.txt

      - name: Compare settings at eight workers and measure peak cgroup memory
        shell: bash
        run: |
          cd ci
          export CPUS=4 MEM=12g PLATFORM=linux/amd64
          image=shopping-sessions:glibc
          comparator=(.venv/bin/python starter-polars/scripts/compare.py)
          baseline=glibc.malloc.hugetlb=1
          tuned=$baseline:glibc.malloc.mmap_threshold=33554432:glibc.malloc.trim_threshold=4294967295:glibc.malloc.top_pad=67108864
          mkdir -m 777 compare-base compare-tuned timed-output bench-scratch
          run_container() {
            local settings="$1" input="$2" out="$3" mode="$4"
            local entry=/app/pipeline
            local args=()
            if [[ "$mode" == memory ]]; then
              entry=/bin/sh
              args=(-c '/app/pipeline && { printf "Peak cgroup bytes: "; cat /sys/fs/cgroup/memory.peak; printf "CPU quota: "; cat /sys/fs/cgroup/cpu.max; grep -E "^pg(maj)?fault " /sys/fs/cgroup/memory.stat; }')
            fi
            if [[ "$mode" == timed ]]; then
              local timer=(/usr/bin/time -f "$input $version %e" -a -o timings.txt)
            else
              local timer=()
            fi
            "${timer[@]}" docker run --rm --platform linux/amd64 --network none --read-only \
              --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 4096 \
              --cpus "$CPUS" --memory "$MEM" --memory-swap "$MEM" --user 1000:1000 \
              -v "$PWD/$input":/data:ro -v "$PWD/$out":/output -v "$PWD/bench-scratch":/scratch \
              -e DATA_DIR=/data -e OUTPUT_DIR=/output -e SCRATCH_DIR=/scratch -e HOME=/scratch -e TMPDIR=/scratch \
              -e NCPU=8 -e MEM_GB=12 -e "GLIBC_TUNABLES=$settings" \
              --entrypoint "$entry" "$image" "${args[@]}"
          }
          run_container "$baseline" dev compare-base direct
          run_container "$tuned" dev compare-tuned direct
          "${comparator[@]}" compare-base dev-answer
          "${comparator[@]}" compare-tuned dev-answer
          run_container "$baseline" practice compare-base memory
          run_container "$tuned" practice compare-tuned memory
          "${comparator[@]}" compare-base compare-tuned
          benchmark() {
            local input="$1" cycles="$2"
            for ((round=0; round<cycles; round++)); do
              if (( round % 2 )); then
                order=(tuned baseline)
              else
                order=(baseline tuned)
              fi
              for version in "${order[@]}"; do
                run_container "${!version}" "$input" timed-output timed
              done
            done
          }
          benchmark practice 5
          generator/target/release/generate --seed 77 --events 60000000 --clicks 15000000 --output final-data
          echo "Final memory baseline"
          run_container "$baseline" final-data compare-base memory
          echo "Final memory tuned"
          run_container "$tuned" final-data compare-tuned memory
          "${comparator[@]}" compare-base compare-tuned
          benchmark final-data 3
          cat timings.txt
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from collections import defaultdict
          from statistics import median
          data = defaultdict(list)
          for line in open("timings.txt"):
              size, config, seconds = line.split()
              data[size, config].append(float(seconds))
          for size in ("practice", "final-data"):
              a, b = (median(data[size, config]) for config in ("baseline", "tuned"))
              print(f"{size}: baseline {a:.3f}s, tuned {b:.3f}s, reduction {1-b/a:.1%}")
          PY
