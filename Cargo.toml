[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pipeline"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
rustc-hash = "2"
memchr = "2"
parquet = { version = "55", default-features = false, features = ["arrow"] }
arrow-array = "55"
arrow-schema = "55"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
